<!DOCTYPE html>
<html lang="tr" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <title>Voldena-DM İndirme</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #0b1120;
            color: #f8fafc;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            -webkit-app-region: drag;
        }
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            background: rgba(15, 23, 42, 0.8);
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }
        .header h3 {
            font-size: 13px;
            font-weight: 500;
            opacity: 0.8;
        }
        .close-btn {
            -webkit-app-region: no-drag;
            background: none;
            border: none;
            color: #94a3b8;
            font-size: 16px;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 4px;
        }
        .close-btn:hover { background: rgba(239,68,68,0.2); color: #ef4444; }
        .content {
            flex: 1;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 14px;
        }
        .filename {
            font-size: 15px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .progress-bar {
            width: 100%;
            height: 8px;
            background: rgba(255,255,255,0.08);
            border-radius: 4px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #7c3aed, #6366f1, #60a5fa);
            border-radius: 4px;
            transition: width 0.3s ease;
        }
        .progress-fill.complete {
            background: linear-gradient(90deg, #22c55e, #16a34a);
        }
        .stats {
            font-size: 12px;
            color: #94a3b8;
            display: flex;
            justify-content: space-between;
        }
        .speed { color: #60a5fa; font-weight: 500; }
        .eta { color: #a78bfa; }
    </style>
</head>
<body>
    <div class="header">
        <h3>⚡ Voldena-DM</h3>
        <button class="close-btn" onclick="window.close()">✕</button>
    </div>
    <div class="content">
        <div class="filename" id="dl-filename">Bağlanıyor...</div>
        <div class="progress-bar">
            <div class="progress-fill" id="dl-fill"></div>
        </div>
        <div class="stats">
            <span id="dl-size">0 MB / 0 MB</span>
            <span>
                <span class="speed" id="dl-speed"></span>
                <span class="eta" id="dl-eta"></span>
            </span>
        </div>
    </div>

    <script>
        const { ipcRenderer } = require('electron');

        ipcRenderer.on('dl-info', (event, data) => {
            document.getElementById('dl-filename').textContent = data.filename || 'İndiriliyor...';
            document.title = `${data.filename} - Voldena-DM`;
        });

        ipcRenderer.on('dl-progress', (event, data) => {
            const fill = document.getElementById('dl-fill');
            const sizeEl = document.getElementById('dl-size');
            const speedEl = document.getElementById('dl-speed');
            const etaEl = document.getElementById('dl-eta');

            fill.style.width = `${data.percentage}%`;

            const dlMB = (data.downloaded / (1024 * 1024)).toFixed(2);
            const totalMB = (data.total / (1024 * 1024)).toFixed(2);
            sizeEl.textContent = `${dlMB} MB / ${totalMB} MB (${data.percentage.toFixed(1)}%)`;

            if (data.speed && data.speed !== '0.00') {
                speedEl.textContent = `${data.speed} MB/s`;
            }

            // ETA
            if (data.speed && parseFloat(data.speed) > 0 && data.total > data.downloaded) {
                const rem = data.total - data.downloaded;
                const spd = parseFloat(data.speed) * 1024 * 1024;
                const sec = Math.ceil(rem / spd);
                if (sec < 60) etaEl.textContent = ` • ${sec} sn kaldı`;
                else if (sec < 3600) etaEl.textContent = ` • ${Math.floor(sec/60)} dk ${sec%60} sn kaldı`;
                else etaEl.textContent = ` • ${Math.floor(sec/3600)} sa ${Math.floor((sec%3600)/60)} dk kaldı`;
            }

            if (data.percentage >= 100) {
                fill.classList.add('complete');
                speedEl.textContent = '';
                etaEl.textContent = '✅ Tamamlandı!';
                const nameEl = document.getElementById('dl-filename');
                if (!nameEl.textContent.includes('✅')) {
                    nameEl.textContent += ' ✅';
                }
            }
        });

        ipcRenderer.on('dl-error', (event, data) => {
            document.getElementById('dl-speed').textContent = '';
            document.getElementById('dl-eta').textContent = '❌ ' + data.message;
            document.getElementById('dl-eta').style.color = '#ef4444';
        });
    </script>
</body>
</html>
